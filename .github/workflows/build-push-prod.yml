name: Build & Push (Production)

# Production mirror of build-push-staging.yml. Fires on pushes to `main` and
# pushes the image to the brain-prod-450115 Artifact Registry. Auth uses
# Workload Identity Federation against the prod project's github-actions-pool.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'charts/**'
      - '.github/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: build-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'automatic update of')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to brain-prod
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/875271186470/locations/global/workloadIdentityPools/github-actions-pool/providers/github
          service_account: gha-tavily-mcp@brain-prod-450115.iam.gserviceaccount.com

      - name: Set up gcloud (brain-prod)
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for brain-prod registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push to brain-prod
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: europe-west1-docker.pkg.dev/brain-prod-450115/brain-mcp-tavily/tavily-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
